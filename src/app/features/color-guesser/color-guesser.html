<p>ქულა: {{ score() }}</p>

<p>გამოიცანი ფერი</p>

@if (messagePrefix()) {
  <p>
    {{ messagePrefix() }}<span [style.color]="messageColor()">{{ target().name }}</span>
  </p>
}

<div class="options">
  @for (color of options(); track color.name) {
    <button [style.color]="color.value" (click)="guess(color)">
      {{ color.name }}
    </button>
  }
</div>
