<div class="w-full max-w-[400px] mx-auto my-10 text-center bg-[#1a1a1a] text-[#f0f0f0] rounded-xl p-5">

  <p>ქულა: {{ score() }}</p>

  <p>გამოიცანი ფერი</p>

  @if (messagePrefix()) {
    <p>
      {{ messagePrefix() }}<span [style.color]="messageColor()">{{ target().name }}</span>
    </p>
  }

  <div class="flex flex-wrap justify-center gap-2 mt-3">
    @for (color of options(); track color.name) {
      <button
        [style.color]="color.value"
        (click)="guess(color)"
        class="px-3.5 py-2 m-1 rounded-full bg-[#f5f5f5] font-medium shadow-sm cursor-pointer transition-colors hover:bg-[#eaeaea]"
      >
        {{ color.name }}
      </button>
    }
  </div>

</div>
