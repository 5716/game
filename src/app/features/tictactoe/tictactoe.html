@if (!winner()) {
  <p>სვლა ეკუთვნის: {{ currentPlayer() }}-ს</p>
}
@if (winner() === 'Draw') {
  <p>ეს თამაში ფრეა!</p>
}
@if (winner() && winner() !== 'Draw') {
  <p>{{ winner() }}-მა გაიმარჯვა!</p>
}

<div class="relative grid grid-cols-[repeat(3,60px)] grid-rows-[repeat(3,60px)]">
  @for (cell of board(); track $index) {
    <div class="border border-[#444] flex items-center justify-center text-2xl cursor-pointer" (click)="makeMove($index)">
      {{ cell }}
    </div>
  }

  @if (winningComboIndex() >= 0) {
    <div class="line line-{{ winningComboIndex() }}"></div>
  }
</div>

<button
  (click)="resetGame()"
  class="px-3.5 py-2 m-1 rounded-full bg-[#f5f5f5] text-[#1a1a1a] font-medium shadow-sm cursor-pointer transition-colors hover:bg-[#eaeaea]"
>
  თამაშის თავიდან დაწყება
</button>
